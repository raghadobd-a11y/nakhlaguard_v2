<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NakhlaGuard — Farmer Alert Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14201B; --ink-soft:#4A5750; --sand:#EDE6D6; --sand-deep:#E1D8C2;
    --palm:#1F5C4A; --palm-deep:#123A2E; --date:#B8752E;
    --moderate:#C1650E; --advanced:#A63D40; --card:#FBF9F3;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  body{
    font-family:'IBM Plex Sans',sans-serif; background:var(--sand); color:var(--ink);
    min-height:100vh; padding:0 0 28px;
  }
  body.rtl{font-family:'Tajawal',sans-serif; direction:rtl}
  body.rtl h1{font-family:'Tajawal',sans-serif}
  h1,h2{font-family:'Space Grotesk',sans-serif}
  .wrap{max-width:600px; margin:0 auto; padding:0 20px}
  .back{display:inline-block; font-size:.85rem; color:var(--palm-deep); text-decoration:none; margin:14px 0}
  header{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px}
  h1{font-size:1.35rem; color:var(--palm-deep)}
  .status{display:flex; align-items:center; gap:6px; font-size:.82rem; color:var(--ink-soft)}
  .dot{width:9px; height:9px; border-radius:50%; background:#ccc}
  .dot.on{background:var(--palm)} .dot.off{background:var(--advanced)}

  #langToggle{
    position:fixed; top:14px; right:14px; z-index:1000; width:auto; margin:0;
    background:var(--ink); border:1px solid rgba(237,230,214,.35); color:var(--sand);
    padding:7px 16px; border-radius:20px; font-size:.78rem; cursor:pointer; font-family:inherit;
    box-shadow:0 2px 10px rgba(0,0,0,.3);
  }
  #langToggle:hover{border-color:var(--sand)}

  .empty{text-align:center; color:var(--ink-soft); padding:60px 20px; font-size:.92rem}

  .alert-card{
    background:var(--card); border-radius:14px; padding:18px; margin-bottom:12px;
    border-right:5px solid #ccc; animation:slideIn .3s ease-out;
  }
  body.rtl .alert-card{border-right:none; border-left:5px solid #ccc}
  .alert-card.moderate{border-right-color:var(--moderate)}
  .alert-card.advanced{border-right-color:var(--advanced)}
  body.rtl .alert-card.moderate{border-left-color:var(--moderate)}
  body.rtl .alert-card.advanced{border-left-color:var(--advanced)}
  @keyframes slideIn{from{opacity:0; transform:translateY(-8px)} to{opacity:1; transform:translateY(0)}}

  .alert-top{display:flex; justify-content:space-between; align-items:center; margin-bottom:6px}
  .badge{padding:4px 12px; border-radius:20px; font-weight:700; font-size:.78rem; color:#fff}
  .badge.moderate{background:var(--moderate)} .badge.advanced{background:var(--advanced)}
  .time{font-size:.75rem; color:var(--ink-soft)}
  .palm-id{font-weight:700; font-family:'Space Grotesk',sans-serif}
  body.rtl .palm-id{font-family:'Tajawal',sans-serif}
  .rec{font-size:.87rem; line-height:1.7; white-space:pre-wrap; margin-top:8px; color:var(--ink-soft)}
  .nav-link{display:block; text-align:center; font-size:.85rem; color:var(--palm-deep); margin-top:16px}

  #enableSound{
    display:block; width:100%; padding:12px; margin-bottom:16px; border:none;
    border-radius:10px; background:var(--palm); color:#fff; font-weight:700; cursor:pointer;
    font-family:'Space Grotesk',sans-serif;
  }
  body.rtl #enableSound{font-family:'Tajawal',sans-serif}
  #enableSound:hover{background:var(--palm-deep)}

  #recheckBanner:empty{display:none}
  .recheck-box{
    background:var(--card); border:1.5px dashed var(--date); border-radius:12px;
    padding:14px 16px; margin-bottom:16px; font-size:.85rem;
  }
  .recheck-title{font-weight:700; color:var(--palm-deep); margin-bottom:6px}
  .recheck-item{display:flex; justify-content:space-between; padding:4px 0; color:var(--ink-soft)}

  details.contact-box{
    background:var(--card); border-radius:12px; margin-bottom:16px; font-size:.85rem;
  }
  details.contact-box summary{
    cursor:pointer; list-style:none; padding:12px 16px; font-weight:700; color:var(--palm-deep);
    display:flex; justify-content:space-between; align-items:center;
  }
  details.contact-box summary::-webkit-details-marker{display:none}
  details.contact-box .cbody{padding:0 16px 16px}
  .contact-row{display:flex; gap:8px; margin-bottom:8px}
  .contact-row input{
    flex:1; padding:9px 11px; border:1.5px solid var(--sand-deep); border-radius:8px;
    font-family:inherit; font-size:.85rem;
  }
  #contactSaveBtn{
    width:auto; padding:8px 16px; margin:0; background:var(--palm); color:#fff; border:none;
    border-radius:8px; font-weight:700; cursor:pointer; font-size:.82rem; font-family:'Space Grotesk',sans-serif;
  }
  body.rtl #contactSaveBtn{font-family:'Tajawal',sans-serif}
  #contactSaveBtn:hover{background:var(--palm-deep)}
  #contactStatus{font-size:.76rem; color:var(--ink-soft); margin-top:6px}
  .alert-contact{
    margin-top:8px; padding-top:8px; border-top:1px dashed var(--sand-deep);
    font-size:.78rem; color:var(--ink-soft);
  }
</style>
</head>
<body>
<button id="langToggle" onclick="toggleLang()">العربية</button>
<div class="wrap">
  <a href="/index.html" class="back" data-en="← Back to overview" data-ar="← رجوع للصفحة الرئيسية">← Back to overview</a>
  <header>
    <h1 data-en="🔔 Farmer alert dashboard" data-ar="🔔 لوحة إشعارات المزارع">🔔 Farmer alert dashboard</h1>
    <div class="status"><span class="dot" id="statusDot"></span><span id="statusText" data-en="Connecting…" data-ar="جاري الاتصال…">Connecting…</span></div>
  </header>

  <button id="enableSound" data-en="Enable sound &amp; browser notifications" data-ar="فعّل الصوت وإشعارات المتصفح">Enable sound &amp; browser notifications</button>

  <details class="contact-box">
    <summary>
      <span data-en="📞 Backup contact" data-ar="📞 جهة اتصال احتياطية">📞 Backup contact</span>
      <span id="contactSummary" style="font-weight:400; font-size:.78rem"></span>
    </summary>
    <div class="cbody">
      <p style="font-size:.78rem; color:var(--ink-soft); margin-bottom:10px" data-en="Set someone to contact if you're unavailable (traveling, out of the country) — shown automatically on every risk alert." data-ar="حدّد شخصًا يُتواصل معه إذا كنت غير متوفر (مسافر، خارج البلد) — يظهر تلقائيًا مع كل تنبيه خطر.">Set someone to contact if you're unavailable (traveling, out of the country) — shown automatically on every risk alert.</p>
      <div class="contact-row">
        <input type="text" id="contactName" data-en-ph="Contact name" data-ar-ph="اسم جهة الاتصال" placeholder="Contact name">
        <input type="tel" id="contactPhone" data-en-ph="Phone number" data-ar-ph="رقم الجوال" placeholder="Phone number">
      </div>
      <button id="contactSaveBtn" onclick="saveFarmContact()" data-en="Save" data-ar="حفظ">Save</button>
      <div id="contactStatus"></div>
    </div>
  </details>

  <div id="recheckBanner"></div>

  <div id="alertsContainer">
    <div class="empty" id="emptyState" data-en="No alerts yet — all monitored palms are healthy ✅" data-ar="لا توجد إشعارات حتى الآن — كل النخيل المراقَبة سليمة ✅">No alerts yet — all monitored palms are healthy ✅</div>
  </div>
  <a href="/agent.html" class="nav-link" data-en="Ask the AI Assistant →" data-ar="اسأل المساعد الذكي ←">Ask the AI Assistant →</a>
  <a href="/palms.html" class="nav-link" data-en="View full palm registry →" data-ar="عرض سجل النخيل كامل ←">View full palm registry →</a>
</div>

<script>
const API_HOST = window.location.host;
let soundEnabled = false;
const CLASS_MAP = { "سليم":"healthy","مبكرة":"early","متوسطة":"moderate","متقدمة":"advanced" };
const CLASS_LABEL = {
  en: { healthy:"Healthy", early:"Early stage", moderate:"Moderate", advanced:"Advanced" },
  ar: { healthy:"سليم", early:"مبكرة", moderate:"متوسطة", advanced:"متقدمة" },
};
const UI_TEXT = {
  en: { enabled:"✅ Notifications enabled", connected:"Connected — waiting for alerts",
        disconnected:"Disconnected — reconnecting…", risk:"risk score:",
        alertTitle: (id) => `⚠️ NakhlaGuard alert: ${id}`,
        alertBody: (sev) => `Severity: ${sev} — action recommended`,
        recheckTitle:"🔔 Palms due for a periodic check (30+ days since last check)",
        recheckNever:"never checked", recheckDays:(n)=>`${n} days ago`,
        contactNotSet:"Not set", contactSaved:"✓ Saved", contactNeedBoth:"Enter both a name and a phone number.",
        contactSaveFail:"Could not save. Is the server running?",
        alertContact:(name,phone)=>`📞 If unavailable, contact: ${name} — ${phone}` },
  ar: { enabled:"✅ الإشعارات مفعّلة", connected:"متصل — بانتظار الإشعارات",
        disconnected:"انقطع الاتصال — جاري إعادة المحاولة…", risk:"نسبة الخطورة:",
        alertTitle: (id) => `⚠️ تنبيه NakhlaGuard: ${id}`,
        alertBody: (sev) => `الشدة: ${sev} — يُنصح بالتدخل`,
        recheckTitle:"🔔 نخيل تحتاج فحصًا دوريًا (مضى عليها 30 يومًا فأكثر)",
        recheckNever:"ما انفحصت أبدًا", recheckDays:(n)=>`قبل ${n} يوم`,
        contactNotSet:"غير محدّدة", contactSaved:"✓ تم الحفظ", contactNeedBoth:"أدخل الاسم ورقم الجوال.",
        contactSaveFail:"تعذّر الحفظ. هل السيرفر شغّال؟",
        alertContact:(name,phone)=>`📞 إذا كنت غير متوفر، تواصل مع: ${name} — ${phone}` },
};

// ---------- تذكير الفحص الدوري (وقائي عام، يتحدّث كل ما الصفحة مفتوحة) ----------
let notifiedRecheckIds = new Set();
async function loadRecheckReminder(){
  const t = UI_TEXT[getLang()];
  const box = document.getElementById('recheckBanner');
  try{
    const res = await fetch('/palms/due-for-recheck');
    const data = await res.json();
    if(!data.palms.length){ box.innerHTML = ''; return; }
    box.innerHTML = `<div class="recheck-box"><div class="recheck-title">${t.recheckTitle}</div>` +
      data.palms.map(p => `<div class="recheck-item"><span>🌴 ${p.palm_id}</span><span>${p.days_since_last_check == null ? t.recheckNever : t.recheckDays(p.days_since_last_check)}</span></div>`).join('') +
      `</div>`;
    if(soundEnabled && Notification.permission === "granted"){
      data.palms.forEach(p => {
        if(!notifiedRecheckIds.has(p.palm_id)){
          notifiedRecheckIds.add(p.palm_id);
          new Notification(t.recheckTitle, { body: `🌴 ${p.palm_id}` });
        }
      });
    }
  }catch(e){ /* صامت - التذكير ميزة إضافية، ما توقف باقي اللوحة */ }
}
loadRecheckReminder();
setInterval(loadRecheckReminder, 5 * 60 * 1000); // إعادة فحص كل 5 دقائق طول ما الصفحة مفتوحة

// ---------- جهة الاتصال الاحتياطية للمزرعة (صف واحد ثابت) ----------
async function loadFarmContact(){
  const t = UI_TEXT[getLang()];
  try{
    const res = await fetch('/farm-contact');
    const data = await res.json();
    document.getElementById('contactSummary').textContent =
      data.contact_name ? `${data.contact_name} — ${data.contact_phone}` : t.contactNotSet;
    if(data.contact_name) document.getElementById('contactName').value = data.contact_name;
    if(data.contact_phone) document.getElementById('contactPhone').value = data.contact_phone;
  }catch(e){ /* صامت - خانة اختيارية */ }
}

async function saveFarmContact(){
  const t = UI_TEXT[getLang()];
  const name = document.getElementById('contactName').value.trim();
  const phone = document.getElementById('contactPhone').value.trim();
  const status = document.getElementById('contactStatus');
  if(!name || !phone){ status.textContent = t.contactNeedBoth; return; }

  const form = new FormData();
  form.append('contact_name', name);
  form.append('contact_phone', phone);
  try{
    await fetch('/farm-contact', { method:'POST', body: form });
    status.textContent = t.contactSaved;
    loadFarmContact();
  }catch(e){
    status.textContent = t.contactSaveFail;
  }
}
loadFarmContact();


document.getElementById('enableSound').onclick = async () => {
  if ("Notification" in window) { await Notification.requestPermission(); }
  soundEnabled = true;
  document.getElementById('enableSound').textContent = UI_TEXT[getLang()].enabled;
};

function playBeep(){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator(); const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = 880;
    g.gain.setValueAtTime(0.2, ctx.currentTime);
    o.start(); o.stop(ctx.currentTime + 0.4);
  }catch(e){}
}

function prettyRec(t){
  return String(t)
    .replace(/^\s*((?:Week|الأسبوع)\s*\d+)\s*\|\s*([^|]+?)\s*(?:\|\s*(.+))?$/gim, (m, a, b, c) => a + ' — ' + b + (c ? ': ' + c : ''))
    .replace(/^\s*((?:Day|اليوم)\s*\d+)\s*\|\s*(.+)$/gim, '     $1: $2');
}
function addAlertCard(data){
  document.getElementById('emptyState')?.remove();
  const container = document.getElementById('alertsContainer');
  const lang = getLang();
  const severityKey = CLASS_MAP[data.severity] || 'moderate';
  const severityLabel = CLASS_LABEL[lang][severityKey] || data.severity;
  const card = document.createElement('div');
  card.className = `alert-card ${severityKey}`;
  const time = new Date(data.timestamp).toLocaleString(lang === 'ar' ? 'ar-SA' : 'en-US');
  card.innerHTML = `
    <div class="alert-top">
      <span class="palm-id">🌴 ${data.palm_id}</span>
      <span class="badge ${severityKey}">${severityLabel}</span>
    </div>
    ${data.location ? `<div class="time">📍 ${data.location}</div>` : ''}
    <div class="time">${time} — ${UI_TEXT[lang].risk} ${(data.score*100).toFixed(0)}%</div>
    <div class="rec">${prettyRec(data.recommendation)}</div>
    ${data.farm_contact && data.farm_contact.contact_name ? `<div class="alert-contact">${UI_TEXT[lang].alertContact(data.farm_contact.contact_name, data.farm_contact.contact_phone)}</div>` : ''}
  `;
  container.prepend(card);

  if(soundEnabled){
    playBeep();
    if (Notification.permission === "granted") {
      new Notification(UI_TEXT[lang].alertTitle(data.palm_id), {
        body: UI_TEXT[lang].alertBody(severityLabel),
      });
    }
  }
}

function connect(){
  const proto = window.location.protocol === "https:" ? "wss" : "ws";
  const ws = new WebSocket(`${proto}://${API_HOST}/ws/alerts`);

  ws.onopen = () => {
    document.getElementById('statusDot').className = 'dot on';
    document.getElementById('statusText').textContent = UI_TEXT[getLang()].connected;
  };
  ws.onclose = () => {
    document.getElementById('statusDot').className = 'dot off';
    document.getElementById('statusText').textContent = UI_TEXT[getLang()].disconnected;
    setTimeout(connect, 3000);
  };
  ws.onmessage = (event) => {
    const data = JSON.parse(event.data);
    if (data.type === 'alert') addAlertCard(data);
  };
}

connect();

// ---------- تبديل اللغة (عربي/إنجليزي) - مشترك عبر كل صفحات الموقع ----------
function getLang(){ return localStorage.getItem('nakhlaguard-lang') || 'en'; }
function setLang(lang){
  localStorage.setItem('nakhlaguard-lang', lang);
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.body.classList.toggle('rtl', lang === 'ar');
  document.querySelectorAll('[data-en]').forEach(el => {
    el.innerHTML = lang === 'ar' ? el.getAttribute('data-ar') : el.getAttribute('data-en');
  });
  document.querySelectorAll('[data-en-ph]').forEach(el => {
    el.placeholder = lang === 'ar' ? el.getAttribute('data-ar-ph') : el.getAttribute('data-en-ph');
  });
  const btn = document.getElementById('langToggle');
  if(btn) btn.textContent = lang === 'ar' ? 'English' : 'العربية';
  if(typeof loadRecheckReminder === 'function') loadRecheckReminder();
  if(typeof loadFarmContact === 'function') loadFarmContact();
}
function toggleLang(){ setLang(getLang() === 'ar' ? 'en' : 'ar'); }
setLang(getLang());
</script>
</body>
</html>
