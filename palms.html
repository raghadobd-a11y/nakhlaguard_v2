<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NakhlaGuard — Palm Registry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=Tajawal:wght@400;500;700&family=Noto+Nastaliq+Urdu:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14201B; --ink-soft:#4A5750; --sand:#EDE6D6; --sand-deep:#E1D8C2;
    --palm:#1F5C4A; --palm-deep:#123A2E; --date:#B8752E; --card:#FBF9F3;
    --healthy:#2E8B57; --early:#D9822B; --moderate:#C1650E; --advanced:#A63D40;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  body{
    font-family:'IBM Plex Sans',sans-serif; background:var(--sand); color:var(--ink);
    min-height:100vh; padding:0 0 28px;
  }
  body.rtl{font-family:'Tajawal',sans-serif; direction:rtl}
  body.rtl h1, body.rtl h2{font-family:'Tajawal',sans-serif}
  h1,h2{font-family:'Space Grotesk',sans-serif}
  .wrap{max-width:640px; margin:0 auto; padding:0 20px}
  .back{display:inline-block; font-size:.85rem; color:var(--palm-deep); text-decoration:none; margin:14px 0}
  header{margin-bottom:18px}
  h1{font-size:1.35rem; color:var(--palm-deep); margin-bottom:4px}
  .sub{color:var(--ink-soft); font-size:.9rem}

  #langToggle{
    position:fixed; top:14px; right:14px; z-index:1000; width:auto; margin:0;
    background:var(--ink); border:1px solid rgba(237,230,214,.35); color:var(--sand);
    padding:7px 16px; border-radius:20px; font-size:.78rem; cursor:pointer; font-family:inherit;
    box-shadow:0 2px 10px rgba(0,0,0,.3);
  }
  #langToggle:hover{border-color:var(--sand)}

  .add-card{
    background:var(--card); border-radius:14px; padding:20px; margin-bottom:24px;
    border-top:4px solid var(--date);
  }
  .add-card h2{font-size:1.05rem; margin-bottom:14px; color:var(--palm-deep)}
  .row{display:flex; gap:10px; flex-wrap:wrap}
  .row > div{flex:1; min-width:140px}
  label{display:block; font-size:.8rem; font-weight:600; margin-bottom:5px; color:var(--ink)}
  input{
    width:100%; padding:10px; border:1.5px solid var(--sand-deep); border-radius:8px;
    font-family:inherit; background:#fff; font-size:.88rem;
  }
  input:focus{outline:2px solid var(--palm); outline-offset:1px}
  .loc-row{display:flex; gap:8px}
  .loc-row input{flex:1}
  .loc-btn{
    margin-top:0 !important; padding:10px 12px !important; width:auto !important;
    background:var(--date) !important; color:var(--ink) !important; font-size:.82rem !important;
    white-space:nowrap;
  }
  .loc-btn:hover{background:#d99a55 !important}
  .loc-status{font-size:.76rem; color:var(--ink-soft); margin-top:4px}
  button{
    margin-top:14px; padding:11px 22px; background:var(--palm); color:#fff; border:none;
    border-radius:8px; font-weight:700; cursor:pointer; font-family:'Space Grotesk',sans-serif;
    font-size:.88rem;
  }
  body.rtl button{font-family:'Tajawal',sans-serif}
  button:hover{background:var(--palm-deep)}

  .list-title{font-size:.85rem; font-weight:600; color:var(--ink-soft); margin-bottom:10px; text-transform:uppercase; letter-spacing:.02em}
  .palm-card{
    background:var(--card); border-radius:12px; padding:16px; margin-bottom:10px;
    display:flex; justify-content:space-between; align-items:center; gap:12px;
    border-right:5px solid #ccc;
  }
  body.rtl .palm-card{border-right:none; border-left:5px solid #ccc}
  .palm-card.healthy{border-right-color:var(--healthy)}
  .palm-card.early{border-right-color:var(--early)}
  .palm-card.moderate{border-right-color:var(--moderate)}
  .palm-card.advanced{border-right-color:var(--advanced)}
  body.rtl .palm-card.healthy{border-left-color:var(--healthy)}
  body.rtl .palm-card.early{border-left-color:var(--early)}
  body.rtl .palm-card.moderate{border-left-color:var(--moderate)}
  body.rtl .palm-card.advanced{border-left-color:var(--advanced)}
  .palm-card .info{flex:1}
  .palm-id{font-family:'Space Grotesk',sans-serif; font-weight:700}
  body.rtl .palm-id{font-family:'Tajawal',sans-serif}
  .location{font-size:.85rem; color:var(--ink-soft); margin-top:2px}
  .last-check{font-size:.75rem; color:#999; margin-top:4px}
  .badge{padding:4px 12px; border-radius:20px; font-weight:700; font-size:.78rem; color:#fff; white-space:nowrap}
  .badge.healthy{background:var(--healthy)} .badge.early{background:var(--early)}
  .badge.moderate{background:var(--moderate)} .badge.advanced{background:var(--advanced)}
  .badge.unchecked{background:#aaa}

  .side{display:flex; flex-direction:column; align-items:center; gap:6px}
  .qr-box{width:52px; height:52px; background:#fff; border-radius:6px; padding:4px; cursor:pointer}
  .qr-box img, .qr-box canvas{width:100% !important; height:100% !important}
  .qr-link{font-size:.68rem; color:var(--palm-deep); text-decoration:none}

  .empty{text-align:center; color:var(--ink-soft); padding:40px 20px; font-size:.9rem}

  /* ---- Urdu (اردو): Noto Nastaliq Urdu, tall line-height, RTL ---- */
  body.lang-ur, body.lang-ur *:not(code):not(.repro){ font-family:'Noto Nastaliq Urdu','Noto Naskh Arabic','Tajawal',serif !important }
  body.lang-ur{ line-height:2.1 }
  body.lang-ur h1, body.lang-ur h2, body.lang-ur h3, body.lang-ur h4{ line-height:2 }
  body.lang-ur button, body.lang-ur input, body.lang-ur select, body.lang-ur textarea, body.lang-ur .nk-tab{ line-height:1.8 }
</style>
</head>
<body>
<button id="langToggle" onclick="toggleLang()">العربية</button>
<div class="wrap">
  <a href="/index.html" class="back" data-en="← Back to overview" data-ar="← رجوع للصفحة الرئيسية" data-ur="← جائزے پر واپس">← Back to overview</a>
  <header>
    <h1 data-en="🌴 Palm Registry" data-ar="🌴 سجل النخيل" data-ur="🌴 کھجوروں کا ریکارڈ">🌴 Palm Registry</h1>
    <p class="sub" data-en="Track every palm's location and health status in one place." data-ar="تابع موقع كل نخلة وحالتها في مكان واحد." data-ur="ہر کھجور کا مقام اور صحت کی حالت ایک ہی جگہ دیکھیں۔">Track every palm's location and health status in one place.</p>
  </header>

  <div class="add-card">
    <h2 data-en="Register a palm" data-ar="سجّل نخلة" data-ur="کھجور درج کریں">Register a palm</h2>
    <div class="row">
      <div>
        <label data-en="Palm ID" data-ar="رقم النخلة" data-ur="کھجور نمبر">Palm ID</label>
        <input type="text" id="newPalmId" data-en-ph="e.g. Palm-B07" data-ar-ph="مثلاً Palm-B07" data-ur-ph="مثلاً Palm-B07" placeholder="e.g. Palm-B07">
      </div>
      <div>
        <label data-en="Location" data-ar="الموقع" data-ur="مقام">Location</label>
        <div class="loc-row">
          <input type="text" id="newLocation" data-en-ph="Tap 📍 to auto-detect" data-ar-ph="اضغط 📍 للالتقاط التلقائي" data-ur-ph="خودکار شناخت کے لیے 📍 دبائیں" placeholder="Tap 📍 to auto-detect">
          <button type="button" class="loc-btn" onclick="useMyLocation('newLocation','newLocStatus')">📍</button>
        </div>
        <div class="loc-status" id="newLocStatus"></div>
      </div>
    </div>
    <label style="margin-top:10px" data-en="Additional description (optional)" data-ar="وصف إضافي (اختياري)" data-ur="اضافی تفصیل (اختیاری)">Additional description (optional)</label>
    <input type="text" id="newNotes" data-en-ph="e.g. planted 2019, irrigation line A" data-ar-ph="مثلاً زُرعت 2019، خط ري A" data-ur-ph="مثلاً 2019 میں لگائی گئی، آبپاشی لائن A" placeholder="e.g. planted 2019, irrigation line A">
    <label style="margin-top:10px" data-en="Age in years (optional — affects RPW risk)" data-ar="العمر بالسنوات (اختياري — يؤثر على خطورة الإصابة)" data-ur="عمر سالوں میں (اختیاری — حملے کے خطرے پر اثر انداز ہوتی ہے)">Age in years (optional — affects RPW risk)</label>
    <input type="number" id="newAge" min="0" max="150" data-en-ph="e.g. 7" data-ar-ph="مثلاً 7" data-ur-ph="مثلاً 7" placeholder="e.g. 7">
    <button onclick="addPalm()" data-en="Add palm" data-ar="أضف النخلة" data-ur="کھجور شامل کریں">Add palm</button>
  </div>

  <div class="list-title" data-en="Registered palms" data-ar="النخيل المسجّلة" data-ur="درج شدہ کھجوریں">Registered palms</div>
  <div id="palmList"><div class="empty" data-en="Loading…" data-ar="جارٍ التحميل…" data-ur="لوڈ ہو رہا ہے…">Loading…</div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const CLASS_MAP = { "سليم":"healthy","مبكرة":"early","متوسطة":"moderate","متقدمة":"advanced" };
const CLASS_LABEL = {
  en: { healthy:"Healthy", early:"Early stage", moderate:"Moderate", advanced:"Advanced" },
  ar: { healthy:"سليم", early:"مبكرة", moderate:"متوسطة", advanced:"متقدمة" },
  ur: { healthy:"صحت مند", early:"ابتدائی مرحلہ", moderate:"درمیانہ", advanced:"شدید" },
};
const UI_TEXT = {
  en: { geoUnsupported:"Geolocation is not supported on this device.", detecting:"Detecting…",
        captured:"📍 Captured", failed:"Failed: ", notTested:"Not tested yet",
        noneYet:"No palms registered yet — add your first one above.",
        loadError:"Could not load the registry. Is the server running?",
        noLocation:"No location set", lastChecked:"Last checked: ", ageLabel:"Age: ",
        needFields:"Please enter both a Palm ID and a location.",
        saveError:"Could not save the palm. Is the server running?",
        viewStatus:"View status" },
  ar: { geoUnsupported:"الجهاز لا يدعم تحديد الموقع.", detecting:"جارٍ التحديد…",
        captured:"📍 تم التحديد", failed:"فشل: ", notTested:"لم تُفحص بعد",
        noneYet:"لا يوجد نخيل مسجَّل بعد — أضف أول نخلة أعلاه.",
        loadError:"تعذّر تحميل السجل. هل الخادم يعمل؟",
        noLocation:"لا يوجد موقع محدد", lastChecked:"آخر فحص: ", ageLabel:"العمر: ",
        needFields:"أدخل رقم النخلة والموقع.",
        saveError:"تعذّر حفظ النخلة. هل الخادم يعمل؟",
        viewStatus:"عرض الحالة" },
  ur: { geoUnsupported:"اس ڈیوائس پر مقام کی شناخت دستیاب نہیں۔", detecting:"شناخت ہو رہی ہے…",
        captured:"📍 مقام حاصل ہو گیا", failed:"ناکام: ", notTested:"ابھی جانچ نہیں ہوئی",
        noneYet:"ابھی کوئی کھجور درج نہیں — اوپر اپنی پہلی کھجور شامل کریں۔",
        loadError:"ریکارڈ لوڈ نہیں ہو سکا۔ کیا سرور چل رہا ہے؟",
        noLocation:"مقام درج نہیں", lastChecked:"آخری جانچ: ", ageLabel:"عمر: ",
        needFields:"براہِ کرم کھجور نمبر اور مقام دونوں درج کریں۔",
        saveError:"کھجور محفوظ نہیں ہو سکی۔ کیا سرور چل رہا ہے؟",
        viewStatus:"حالت دیکھیں" },
};

// يلتقط موقع GPS الحالي من متصفح الجهاز تلقائيًا بدل الكتابة اليدوية
function useMyLocation(inputId, statusId){
  const status = document.getElementById(statusId);
  const t = UI_TEXT[getLang()];
  if(!navigator.geolocation){
    status.textContent = t.geoUnsupported;
    return;
  }
  status.textContent = t.detecting;
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      const lat = pos.coords.latitude.toFixed(5);
      const lon = pos.coords.longitude.toFixed(5);
      document.getElementById(inputId).value = `${lat}, ${lon}`;
      status.textContent = t.captured;
    },
    (err) => { status.textContent = t.failed + err.message; },
    { enableHighAccuracy: true, timeout: 10000 }
  );
}

async function loadPalms(){
  const container = document.getElementById('palmList');
  const lang = getLang();
  const t = UI_TEXT[lang];
  const labels = CLASS_LABEL[lang];
  try{
    const res = await fetch('/palms');
    const data = await res.json();
    if(!data.palms.length){
      container.innerHTML = `<div class="empty">${t.noneYet}</div>`;
      return;
    }
    container.innerHTML = data.palms.map(p => {
      const statusKey = CLASS_MAP[p.latest_status] || null;
      const badge = statusKey
        ? `<span class="badge ${statusKey}">${labels[statusKey]}</span>`
        : `<span class="badge unchecked">${t.notTested}</span>`;
      const lastCheck = p.latest_check ? new Date(p.latest_check).toLocaleDateString(LOCALES[lang]) : '';
      return `
        <div class="palm-card ${statusKey || ''}">
          <div class="info">
            <div class="palm-id">🌴 ${p.palm_id}</div>
            <div class="location">${p.location || t.noLocation}${p.age_years != null ? ' · ' + t.ageLabel + p.age_years : ''}</div>
            ${lastCheck ? `<div class="last-check">${t.lastChecked}${lastCheck}</div>` : ''}
          </div>
          <div class="side">
            ${badge}
            <div class="qr-box" id="qr-${cssEscape(p.palm_id)}" onclick="location.href='/palm.html?id=${encodeURIComponent(p.palm_id)}'"></div>
            <a class="qr-link" href="/palm.html?id=${encodeURIComponent(p.palm_id)}">${t.viewStatus}</a>
          </div>
        </div>`;
    }).join('');
    renderQrCodes(data.palms.map(p => p.palm_id));
  }catch(e){
    container.innerHTML = `<div class="empty">${t.loadError}</div>`;
  }
}

// يولّد رمز QR لكل نخلة، يفتح صفحة حالتها الحية (/palm.html?id=...).
// نولّدها بعد ما يُبنى الـHTML، عشان عناصر qr-box تكون موجودة بالصفحة فعليًا
function cssEscape(s){ return String(s).replace(/[^a-zA-Z0-9_-]/g, '_'); }
function renderQrCodes(palmIds){
  if(typeof QRCode === 'undefined') return;  // لو ما وصل سكربت QR (مثلاً بدون إنترنت)، نتجاهل بصمت
  const base = location.origin;
  palmIds.forEach(id => {
    const el = document.getElementById(`qr-${cssEscape(id)}`);
    if(!el) return;
    el.innerHTML = '';
    new QRCode(el, { text: `${base}/palm.html?id=${encodeURIComponent(id)}`, width: 44, height: 44, correctLevel: QRCode.CorrectLevel.M });
  });
}

async function addPalm(){
  const t = UI_TEXT[getLang()];
  const palmId = document.getElementById('newPalmId').value.trim();
  const location = document.getElementById('newLocation').value.trim();
  const notes = document.getElementById('newNotes').value.trim();
  const age = document.getElementById('newAge').value;

  if(!palmId || !location){ alert(t.needFields); return; }

  const form = new FormData();
  form.append('palm_id', palmId);
  form.append('location', location);
  if(notes) form.append('notes', notes);
  if(age) form.append('age_years', age);

  try{
    await fetch('/palms', { method:'POST', body: form });
    document.getElementById('newPalmId').value = '';
    document.getElementById('newLocation').value = '';
    document.getElementById('newNotes').value = '';
    document.getElementById('newAge').value = '';
    loadPalms();
  }catch(e){
    alert(t.saveError);
  }
}

loadPalms();

// ---------- تبديل اللغة (عربي / English / اردو) - مشترك عبر كل صفحات الموقع ----------
var LANG_CYCLE = ['ar', 'en', 'ur'];
var LANG_BTN_LABEL = { ar: 'English', en: 'اردو', ur: 'العربية' };
var LOCALES = { ar: 'ar-SA', en: 'en-US', ur: 'ur-PK' };
function getLang(){ let l = null; try{ l = localStorage.getItem('nakhlaguard-lang'); }catch(e){} return (l === 'ar' || l === 'en' || l === 'ur') ? l : 'ar'; }   // لا يعتمد على ثوابت معرَّفة لاحقًا، لأن بعض الصفحات تناديه قبل نهاية السكربت
function setLang(lang){
  if(!LANG_CYCLE.includes(lang)) lang = 'ar';
  try{ localStorage.setItem('nakhlaguard-lang', lang); }catch(e){}
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'en' ? 'ltr' : 'rtl';
  document.body.classList.toggle('rtl', lang !== 'en');
  document.body.classList.toggle('lang-ur', lang === 'ur');
  document.querySelectorAll('[data-en]').forEach(el => {
    el.innerHTML = el.getAttribute('data-' + lang) ?? el.getAttribute('data-en');
  });
  document.querySelectorAll('[data-en-ph]').forEach(el => {
    el.placeholder = el.getAttribute('data-' + lang + '-ph') ?? el.getAttribute('data-en-ph');
  });
  const btn = document.getElementById('langToggle');
  if(btn) btn.textContent = LANG_BTN_LABEL[lang];
  loadPalms(); // نعيد تحميل القائمة عشان الشارات والتواريخ تترجم فورًا
}
function toggleLang(){ setLang(LANG_CYCLE[(LANG_CYCLE.indexOf(getLang()) + 1) % LANG_CYCLE.length]); }
setLang(getLang());
</script>
<script src="/nav.js" defer></script>
</body>
</html>
